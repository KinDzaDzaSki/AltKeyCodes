<article class="guide-page">
  <div class="container">
    <nav aria-label="Breadcrumb" class="breadcrumb">
      <ol>
        <li><a href="/">Home</a></li>
        <li><a href="/how-to/">How to</a></li>
        <li aria-current="page">{{title}}</li>
      </ol>
    </nav>
    <h1>{{h1}}</h1>
    <p class="byline">By {{author}} on <time datetime="{{published}}" pubdate>{{published}}</time>. Last updated <time datetime="{{updated}}">{{updated}}</time>.</p>
    <div class="guide-body">
      {{{body}}}
    </div>
    <nav class="guide-nav" aria-label="Guides">
      <h2>More guides</h2>
      {{{guide_links}}}
    </nav>
  </div>
</article>
