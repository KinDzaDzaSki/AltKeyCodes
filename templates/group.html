<section class="page-header">
  <div class="container">
    <nav aria-label="Breadcrumb" class="breadcrumb">
      <ol>
        <li><a href="/">Home</a></li>
        <li><a href="/symbols/">Symbols</a></li>
        <li aria-current="page">{{group_name}}</li>
      </ol>
    </nav>
    <h1>{{h1}}</h1>
    <p class="lead">{{tagline}}</p>
    <p class="answer-block">{{{answer_block}}}</p>
  </div>
</section>
<section class="group-content">
  <div class="container">
    <h2>{{symbols_count}} symbols in this group</h2>
    <div class="symbol-grid">
      {{{symbols}}}
    </div>
    <div class="group-siblings">
      <h2>Other groups</h2>
      {{{sibling_groups}}}
    </div>
  </div>
</section>
